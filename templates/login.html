{% extends "base.html" %}
{% block title %}Sign In – SmartCart AI{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-4 border-0">
                <i class="bi bi-shield-lock-fill display-5 mb-2 d-inline-block"></i>
                <h4 class="fw-bold mb-0">Sign In to SmartCart</h4>
                <p class="small text-white-50 mb-0">AI-Powered Shopping Experience</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="loginEmail" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="loginPassword" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="loginPassword" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <!-- Quick Demo Login Presets -->
                <div class="border-top pt-3 mt-4">
                    <div class="small fw-bold text-muted text-uppercase mb-2 text-center">Quick Demo Accounts</div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-primary btn-sm text-start" onclick="fillDemo('customer@smartcart.com', 'Customer@123')">
                            <i class="bi bi-person-check me-2"></i> <strong>Demo Customer:</strong> customer@smartcart.com
                        </button>
                        <button type="button" class="btn btn-outline-danger btn-sm text-start" onclick="fillDemo('admin@smartcart.com', 'Admin@123')">
                            <i class="bi bi-shield-lock me-2"></i> <strong>Demo Admin:</strong> admin@smartcart.com
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4 small">
                    Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(email, password) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = password;
}
</script>
{% endblock %}
